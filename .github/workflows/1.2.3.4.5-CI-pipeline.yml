name: Modules(1-5)-CI-pipeline
on:
  workflow_dispatch:
    inputs:
      Environment:
        description: Target environment?
        type: choice
        options:
          - PROD
          - TEST
          - STAGING
      Version:
        description: version to deploy?
        type: string
        default: 1.0.0

      Skip-tests:
        description: Skips-tests?
        type: boolean
        default: false

  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "Dockerfile"
      - "pom.xml"

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - ".github/**"
jobs:
  build:
    name: checkout, build and upload
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - name: Maven Build
        run: mvn clean package

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myartifact
          path: target/*.jar

      - name: list the artifact and other details
        run: |
          echo "Event name is   : ${{github.event_name}}"
          echo "Branch is       : ${{github.ref_name}}"
          echo "Repository is   : ${{github.repository}}"
          echo "Actor is        : ${{github.actor}}"
          echo "Commitid is     : ${{github.sha}}"
          ls -l target/

  input-context-job:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: printing inputs selected
        run: |
          echo "Environment selected is: ${{inputs.Environment}}"
          echo "Version deployed is: ${{inputs.Version}}"
          echo "Skipped tests: ${{inputs.Skip-tests}}"








