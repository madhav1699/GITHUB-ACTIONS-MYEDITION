name: 06-Environment-Variables
on:
  workflow_dispatch:
env:
  user: "madhav"
  email: "madhav@gmail.com"
jobs:
  job0:
    runs-on: ubuntu-latest
    steps:
      - name: workflow level env declaration
        run: |
          echo "User name is  : $user"
          echo "Email is      : $email"

  job1:
    runs-on: ubuntu-latest
    needs: job0
    env:
      Application: "PAYTM"
      SOURCE: "BANK"
    steps:
      - name: job level env declaration
        run: |
         echo "Application is       : $Application "
         echo "Application Source   : $SOURCE"
  
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: step level env declaration
        env:
          client: "INDIA"
          origin: "MUMBAI"
        run: |
          echo "Client is       : $client"
          echo "Origin is       : $origin"

      - name: accessing step variables from previous
        run: |
          echo "Client is       : $client"
          echo "Origin is       : $origin"
  job3:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - name: $GITHUB_ENV declaration
        run: |
          echo "Partners=ICICI, SBI" >> $GITHUB_ENV
          echo "Percentage= 50%" >> $GITHUB_ENV

      - name: accessing GITHUB_ENV variables previous step
        run: |
          echo "Bank Partners are       : $Partners"
          echo "Bank percentage is      : $Percentage"

  job4:
    runs-on: ubuntu-latest
    needs: job3
    steps:
      - name: Repo and secret variable accessing from GIT UI
        run: |
          echo "Bankusers count       : ${{vars.users}}"
          echo "Bank Balance          : ${{secrets.balance}}"



      